[project]
name = "edgeai-lab2-part3"
version = "0.1.0"
description = "Lab 2 Part 3: calibration-free MX quantization"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.5.1",
    "transformers==4.57.3",
    "accelerate",
    "datasets>=3.6",
    "numpy<2.3",
    "safetensors",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
